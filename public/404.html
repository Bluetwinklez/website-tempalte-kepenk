<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayfa Bulunamadı | Kepenk Sistemleri</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="css/tailwind.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f1115;
            color: #f5f5f5;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            padding: 24px;
            text-align: center;
        }
        .wrap { max-width: 560px; }
        .logo { width: 96px; height: 96px; margin: 0 auto 24px; display: block; }
        .code { font-family: 'Outfit', sans-serif; font-size: 72px; font-weight: 800; line-height: 1; color: #EA580C; margin: 0; }
        h1 { font-family: 'Outfit', sans-serif; font-size: 24px; margin: 12px 0 8px; }
        p { color: #b6bcc6; line-height: 1.6; margin: 0 0 28px; }
        .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 14px 24px; border-radius: 12px; text-decoration: none;
            font-weight: 600; font-size: 15px;
        }
        .btn-primary { background: #EA580C; color: #fff; }
        .btn-wa { background: #25D366; color: #06251a; }
        .btn-ghost { background: rgba(255,255,255,.08); color: #f5f5f5; }
    </style>
</head>
<body>
    <div class="wrap">
        <img src="images/logo-emblem.webp" onerror="this.src='images/logo.webp'" alt="Kepenk Sistemleri" class="logo">
        <p class="code">404</p>
        <h1>Aradığınız sayfa bulunamadı</h1>
        <p>Sayfa taşınmış veya adres yanlış yazılmış olabilir. Acil kepenk arızanız varsa doğrudan bize ulaşın, her zaman hizmetinizdeyiz.</p>
        <div class="actions">
            <a class="btn btn-primary" href="tel:+905550000000">0555 000 00 00 (Ara)</a>
            <a class="btn btn-wa" href="https://wa.me/905550000000?text=Merhaba,%20bilgi%20almak%20istiyorum.">WhatsApp</a>
            <a class="btn btn-ghost" href="/">Ana Sayfa</a>
        </div>
    </div>
</body>
</html>
