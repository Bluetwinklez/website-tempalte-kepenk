<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="steelDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ea580c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="84" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Outer Protective Shield Contour -->
  <path d="M256 64 L416 128 V272 C416 368 344 432 256 464 C168 432 96 368 96 272 V128 Z" 
        fill="#1e293b" stroke="#475569" stroke-width="12" stroke-linejoin="round"/>

  <!-- Shutter Drum / Crown Slat (Orange) -->
  <path d="M128 144 L256 96 L384 144 V192 L256 156 L128 192 Z" 
        fill="url(#orangeGrad)" filter="url(#dropGlow)"/>

  <!-- Slat 1 -->
  <path d="M136 208 L256 176 L376 208 V244 L256 216 L136 244 Z" 
        fill="url(#metalGrad)"/>

  <!-- Slat 2 -->
  <path d="M144 260 L256 232 L368 260 V296 L256 272 L144 296 Z" 
        fill="url(#metalGrad)"/>

  <!-- Slat 3 -->
  <path d="M156 312 L256 288 L356 312 V348 L256 328 L156 348 Z" 
        fill="url(#steelDark)"/>

  <!-- Lower Security V-Point (Orange Accent) -->
  <path d="M184 368 L256 348 L328 368 L256 424 Z" 
        fill="url(#orangeGrad)"/>

  <!-- Precision Vertical Guide Rails -->
  <rect x="116" y="148" width="12" height="196" rx="4" fill="#64748b"/>
  <rect x="384" y="148" width="12" height="196" rx="4" fill="#64748b"/>
</svg>
